<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Your Profile | Seva Bandhu</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            min-height: 100vh;
            background-color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            overflow-x: hidden;
            color: #0f172a;
        }

        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.5;
            pointer-events: none;
            z-index: 0;
        }
        .bg-orb-blue { width: 450px; height: 450px; background: #3b82f6; top: -100px; right: -50px; }
        .bg-orb-indigo { width: 400px; height: 400px; background: #6366f1; bottom: -80px; left: -60px; }

        .auth-container {
            width: 100%;
            max-width: 480px;
            position: relative;
            z-index: 1;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 28px;
            border: 2px solid #ffffff;
            padding: 44px 38px;
            box-shadow: 0 20px 45px -10px rgba(37, 99, 235, 0.12), 0 10px 25px -5px rgba(15, 23, 42, 0.06);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            margin-bottom: 20px;
        }

        .auth-logo-box {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0 8px 16px -4px rgba(37, 99, 235, 0.35);
        }

        .auth-logo-text {
            font-family: 'Outfit', sans-serif;
            font-size: 22px;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.02em;
        }
        .auth-logo-text span {
            color: #2563eb;
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14.5px;
            color: #64748b;
            line-height: 1.5;
        }

        .info-note {
            margin-top: 10px;
            font-size: 13px;
            color: #2563eb;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 12px;
            padding: 10px 14px;
            text-align: left;
            line-height: 1.45;
        }

        .error-box {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 24px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 13.5px;
            font-weight: 700;
            color: #334155;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .country-prefix {
            position: absolute;
            left: 14px;
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: 700;
            font-size: 14.5px;
            color: #475569;
            pointer-events: none;
            user-select: none;
        }

        .input-wrapper input {
            width: 100%;
            padding: 13px 16px 13px 56px;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            color: #0f172a;
            background: #f8fafc;
            outline: none;
            transition: all 0.2s ease;
            font-family: inherit;
            letter-spacing: 0.5px;
        }

        .input-wrapper input:focus {
            border-color: #2563eb;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 8px 20px -4px rgba(37, 99, 235, 0.35);
            font-family: inherit;
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 24px -4px rgba(37, 99, 235, 0.45);
        }

        .btn-submit:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="bg-orb bg-orb-blue"></div>
    <div class="bg-orb bg-orb-indigo"></div>

    <div class="auth-container">
        <div class="auth-card">

            <div class="auth-header">
                <a href="{% url 'home' %}" class="auth-logo">
                    <div class="auth-logo-box">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
                    </div>
                    <div class="auth-logo-text">Seva <span>Bandhu</span></div>
                </a>

                <h1>Complete Your Profile</h1>
                <p class="subtitle">Please enter your mobile number to complete your account setup.</p>
                <div class="info-note">
                    Your mobile number is required for service-related communication.
                </div>
            </div>

            {% if error %}
            <div class="error-box">
                ⚠️ {{ error }}
            </div>
            {% endif %}

            <form method="post" id="complete-profile-form">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">

                <div class="form-group">
                    <label for="mobile">Mobile Number</label>
                    <div class="input-wrapper">
                        <span class="country-prefix">+91</span>
                        <input
                            type="tel"
                            id="mobile"
                            name="mobile"
                            placeholder="9876543210"
                            maxlength="10"
                            pattern="^[6-9]\d{9}$"
                            required
                            autocomplete="tel"
                            inputmode="numeric"
                        >
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    Continue to Dashboard
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                </button>
            </form>

        </div>
    </div>

</body>
</html>

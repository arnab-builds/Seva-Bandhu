{% extends 'admin_custom/base_admin.html' %}

{% block content %}
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
        <h1>{{ action }} Service</h1>
        <a href="{% url 'admin_services_list' %}" class="btn btn-secondary">Back to Services</a>
    </div>
    
    <div class="card" style="max-width: 600px;">
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="name">Service Name</label>
                <input type="text" id="name" name="name" value="{{ service.name }}" required>
            </div>
            
            <div class="form-group">
                <label for="price">Price (₹)</label>
                <input type="number" id="price" name="price" value="{{ service.price }}" required>
            </div>
            
            <div class="form-group">
                <label for="image">Service Image</label>
                {% if service.image %}
                    <div style="margin-bottom: 12px;">
                        <img src="{{ service.image.url }}" alt="{{ service.name }}" style="width: 100px; border-radius: 8px;">
                    </div>
                {% endif %}
                <input type="file" id="image" name="image" accept="image/*" style="width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 8px;">
            </div>
            
            <div class="form-group" style="display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" id="is_enabled" name="is_enabled" {% if action == 'Add' or service.is_enabled %}checked{% endif %} style="width: 18px; height: 18px;">
                <label for="is_enabled" style="margin-bottom: 0;">Is Enabled (Visible to customers for new requests)</label>
            </div>
            
            <div style="margin-top: 32px;">
                <button type="submit" class="btn btn-primary" style="width: 100%;">Save Service</button>
            </div>
        </form>
    </div>
{% endblock %}

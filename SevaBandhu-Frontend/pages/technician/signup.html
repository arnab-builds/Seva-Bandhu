<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    
    <link rel="stylesheet" href="../../assets/css/technician-signup.css">
</head>



<body>

    <form method="post">

       

        <h1>Technician Signup</h1>

        <p class="subtitle">
            Create your technician account and start managing service requests efficiently.
        </p>

        
        <div class="error-box">
            â€”
        </div>
        

        <label for="username">Username</label>
        <input type="text" id="username" name="username" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="contact">Contact</label>
        <input type="text" id="contact" name="contact" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>

        <button
            type="button"
            onclick="googleSignup()"
            class="google-btn">

            Continue with Google

        </button>

        <button type="submit" class="signup-btn">
            Sign Up
        </button>

        <div class="login-box">

            <p>Already have an account?</p>

            <a href="#" class="login-link">
                Login Here
            </a>

        </div>

    </form>

    <script src="../../assets/js/technician-signup.js"></script>
</body>

<main>

    <h1>Phone Verification</h1>

    <p class="subtitle">
      Your account signup was successful.
Continue with phone verification to complete setup securely.
    </p>

    <div class="user-box">

        <p id="google-user">

            Loading user information...

        </p>

        <div style="margin-top:24px;">

            <input
                type="text"
                id="phone"
                placeholder="+91XXXXXXXXXX"
                style="
                    width:100%;
                    padding:14px;
                    border:1px solid #d1d5db;
                    border-radius:14px;
                    margin-bottom:16px;
                    font-size:15px;
                "
            >

            <button
                onclick="sendOTP()"
                style="
                    width:100%;
                    padding:14px;
                    border:none;
                    border-radius:14px;
                    background:#2563eb;
                    color:white;
                    font-weight:700;
                    cursor:pointer;
                    margin-bottom:18px;
                "
            >
                Send OTP
            </button>

            <input
                type="text"
                id="otp"
                placeholder="Enter OTP"
                style="
                    width:100%;
                    padding:14px;
                    border:1px solid #d1d5db;
                    border-radius:14px;
                    margin-bottom:16px;
                    font-size:15px;
                "
            >

            <button
                onclick="verifyOTP()"
                style="
                    width:100%;
                    padding:14px;
                    border:none;
                    border-radius:14px;
                    background:#16a34a;
                    color:white;
                    font-weight:700;
                    cursor:pointer;
                "
            >
                Verify OTP
            </button>

        </div>

    </div>

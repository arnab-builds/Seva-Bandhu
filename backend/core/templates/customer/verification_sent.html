<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Check your email | Seva Bandhu</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f7fb;font:16px system-ui;color:#172033}.card{max-width:480px;margin:24px;padding:36px;background:#fff;border-radius:24px;box-shadow:0 18px 45px #17203312}a{color:#1d4ed8;font-weight:650}button{margin-top:12px;padding:10px 14px;border:0;border-radius:8px;background:#2563eb;color:#fff;font:inherit;cursor:pointer}.status{min-height:22px;color:#475569}</style></head><body><main class="card"><h1>Check your inbox</h1><p>We saved your account and sent a verification link to <strong>{{ email }}</strong>. Open the link from any device, then log in. You will not need to fill out the form again.</p><p class="status" id="status"></p><button id="resend">Resend email</button><p><a href="{% url 'customer_login' %}">Go to login</a></p></main><script>document.getElementById('resend').onclick=async()=>{const s=document.getElementById('status');s.textContent='Sending…';const r=await fetch('{% url "send_verification_email" %}',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':'{{ csrf_token }}'},body:JSON.stringify({email:'{{ email|escapejs }}'})});const d=await r.json();s.textContent=d.message;};</script></body></html>
